services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/app/prisma/dev.db
      - NODE_ENV=production
      - DEFAULT_TIMEZONE=Asia/Riyadh
    volumes:
      - livepulse_data:/app/prisma

volumes:
  livepulse_data:

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="fogCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5F3FC"/>
      <stop offset="50%" stop-color="#21D4D8"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Glow -->
  <circle cx="60" cy="60" r="50" fill="url(#fogCyan)" opacity="0.2" filter="url(#glowCyan)"/>
  <!-- Fog Canister / Smoke Flask -->
  <path d="M48 30 L72 30 L74 42 L84 55 C90 62 88 82 78 90 C68 98 52 98 42 90 C32 82 30 62 36 55 L46 42 Z" fill="#1E293B" stroke="url(#fogCyan)" stroke-width="2.5"/>
  <!-- Swirling Fog Smoke Effect -->
  <path d="M35 70 Q45 55 60 70 T85 70 Q95 78 85 86 T60 86 Q40 88 35 70 Z" fill="url(#fogCyan)" opacity="0.85" filter="url(#glowCyan)"/>
  <!-- Eye Masked Silhouette (Hiding Points) -->
  <path d="M45 62 Q60 50 75 62 Q60 74 45 62 Z" fill="#0F172A" stroke="#FFF" stroke-width="1.5"/>
  <circle cx="60" cy="62" r="3.5" fill="#21D4D8"/>
  <line x1="40" y1="75" x2="80" y2="50" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
</svg>

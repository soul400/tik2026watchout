<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="hammerRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCA5A5"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="50" fill="url(#hammerRed)" opacity="0.15" filter="url(#glowRed)"/>
  <!-- Hammer Head -->
  <rect x="42" y="26" width="46" height="28" rx="6" fill="#334155" stroke="url(#hammerRed)" stroke-width="2.5"/>
  <rect x="36" y="30" width="8" height="20" rx="3" fill="url(#hammerRed)"/>
  <rect x="86" y="30" width="8" height="20" rx="3" fill="url(#hammerRed)"/>
  <!-- Handle -->
  <path d="M60 54 L60 96 L68 96 L68 54 Z" fill="#94A3B8" stroke="#1E293B" stroke-width="2"/>
  <!-- Grip Rings -->
  <line x1="58" y1="75" x2="70" y2="75" stroke="#EF4444" stroke-width="2"/>
  <line x1="58" y1="83" x2="70" y2="83" stroke="#EF4444" stroke-width="2"/>
  <!-- Impact Sparks -->
  <polygon points="30,40 22,35 25,45" fill="#FACC15"/>
  <polygon points="100,40 108,35 105,45" fill="#FACC15"/>
</svg>

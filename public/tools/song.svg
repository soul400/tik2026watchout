<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="songPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E879F9"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Glow -->
  <circle cx="60" cy="60" r="50" fill="url(#songPurple)" opacity="0.18" filter="url(#glowPurple)"/>
  <!-- Microphone & Sound Waves Body -->
  <!-- Sound Waves (Left & Right) -->
  <path d="M30 46 C25 54 25 66 30 74" fill="none" stroke="#E879F9" stroke-width="3" stroke-linecap="round"/>
  <path d="M22 38 C14 52 14 68 22 82" fill="none" stroke="#C084FC" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M90 46 C95 54 95 66 90 74" fill="none" stroke="#E879F9" stroke-width="3" stroke-linecap="round"/>
  <path d="M98 38 C106 52 106 68 98 82" fill="none" stroke="#C084FC" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <!-- Microphone Capsule -->
  <rect x="50" y="26" width="20" height="34" rx="10" fill="url(#songPurple)" stroke="#FFF" stroke-width="2"/>
  <!-- Mic Grid lines -->
  <line x1="53" y1="38" x2="67" y2="38" stroke="#FFF" stroke-width="1.5" opacity="0.8"/>
  <line x1="53" y1="44" x2="67" y2="44" stroke="#FFF" stroke-width="1.5" opacity="0.8"/>
  <!-- Mic Arc & Stand -->
  <path d="M43 45 C43 65 77 65 77 45" fill="none" stroke="#FFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="65" x2="60" y2="82" stroke="#FFF" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="48" y1="82" x2="72" y2="82" stroke="#FFF" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Multiplier Badge (x5) -->
  <rect x="68" y="72" width="40" height="24" rx="6" fill="#9333EA" stroke="#FDE047" stroke-width="2" filter="url(#glowPurple)"/>
  <text x="88" y="89" fill="#FFF" font-family="monospace" font-weight="900" font-size="16" text-anchor="middle">x5</text>
  <!-- Music Note Particle -->
  <circle cx="44" cy="30" r="3" fill="#F472B6"/>
</svg>

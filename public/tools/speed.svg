<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="speedPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="50" fill="url(#speedPurple)" opacity="0.2" filter="url(#glowPurple)"/>
  <!-- Lightning Bolt -->
  <polygon points="65,22 36,62 58,62 48,98 84,52 62,52" fill="#FACC15" stroke="#FFF" stroke-width="2" filter="url(#glowPurple)"/>
  <!-- Speed Double Badge (x2 / x3) -->
  <rect x="25" y="72" width="38" height="24" rx="6" fill="#8B5CF6" stroke="#E9D5FF" stroke-width="2"/>
  <text x="44" y="89" fill="#FFF" font-family="monospace" font-weight="900" font-size="14" text-anchor="middle">x2</text>
</svg>
